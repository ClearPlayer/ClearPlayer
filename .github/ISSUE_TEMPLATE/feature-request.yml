name: Feature request
description: Suggest something ClearPlayer should be able to do
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a look through the open issues first — someone may have asked already, and adding
        a comment to an existing request carries more weight than a duplicate.

        Two things that are out of scope, so nobody spends time writing them up:

        - **Widevine and PlayReady support.** ClearKey only.
        - **Anything that finds, hosts, or bundles content.** ClearPlayer plays the sources you
          give it and will not ship channel lists, directories, or search across providers.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation rather than the solution — it often leads somewhere better.
      placeholder: I watch the same six channels and it takes too many taps to reach them.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
      description: Including how another app handles it, if one does.

  - type: dropdown
    id: device-usage
    attributes:
      label: Which device do you mostly use
      options:
        - iPhone
        - iPad
        - Both about equally
    validations:
      required: true
